<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高级配置示例</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 1200px;
      margin: 30px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }
    .config-section {
      background: #f9f9f9;
      padding: 20px;
      border-radius: 6px;
    }
    .config-section h3 {
      margin-top: 0;
      color: #333;
      font-size: 16px;
    }
    .input-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #666;
      font-size: 14px;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    input[type="color"] {
      width: 100%;
      height: 36px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }
    button {
      background: #007bff;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background: #0056b3;
    }
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-top: 30px;
    }
    .preview-card {
      background: #f9f9f9;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
    }
    .preview-card h4 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #666;
    }
    .preview-card canvas, .preview-card img {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .info-box {
      background: #e7f3ff;
      border-left: 3px solid #007bff;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .info-box h3 {
      margin-top: 0;
      font-size: 16px;
    }
    .info-box ul {
      margin: 10px 0;
      padding-left: 20px;
    }
    .info-box li {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ 高级配置示例</h1>
    <p class="subtitle">展示所有配置选项,包括错误纠正级别、颜色、尺寸等</p>

    <div class="info-box">
      <h3>错误纠正级别说明</h3>
      <ul>
        <li><strong>L级 (Low, 7%)</strong>: 适合干净环境,可存储更多数据</li>
        <li><strong>M级 (Medium, 15%)</strong>: 默认级别,平衡容错和容量</li>
        <li><strong>Q级 (Quartile, 25%)</strong>: 需要更高可靠性的场景</li>
        <li><strong>H级 (High, 30%)</strong>: 二维码可能被部分遮挡或损坏(如嵌入Logo)</li>
      </ul>
    </div>

    <div class="config-grid">
      <div class="config-section">
        <h3>📝 内容配置</h3>
        <div class="input-group">
          <label>要编码的内容</label>
          <input type="text" id="content" value="https://example.com/qr-code-test">
        </div>
        <div class="input-group">
          <label>二维码尺寸</label>
          <input type="number" id="size" value="250" min="100">
        </div>
        <div class="input-group">
          <label>边距(模块单位)</label>
          <input type="number" id="margin" value="4" min="0" max="10">
        </div>
      </div>

      <div class="config-section">
        <h3>🎨 样式配置</h3>
        <div class="input-group">
          <label>前景色</label>
          <input type="color" id="foreground" value="#1a1a1a">
        </div>
        <div class="input-group">
          <label>背景色</label>
          <input type="color" id="background" value="#ffffff">
        </div>
        <div class="input-group">
          <label>输出格式</label>
          <select id="format">
            <option value="canvas">Canvas</option>
            <option value="svg">SVG</option>
            <option value="base64">Base64</option>
          </select>
        </div>
      </div>
    </div>

    <button id="generate-all-btn">生成所有容错级别对比</button>

    <div class="preview-grid" id="preview-grid"></div>
  </div>

  <!-- 引入二维码生成库 (已包含所有依赖) -->
  <script src="/Users/yanjiahui/Desktop/study/qr-code/dist/qrcode-gen.min.js"></script>

  <script>
    const contentInput = document.getElementById('content');
    const sizeInput = document.getElementById('size');
    const marginInput = document.getElementById('margin');
    const foregroundInput = document.getElementById('foreground');
    const backgroundInput = document.getElementById('background');
    const formatSelect = document.getElementById('format');
    const generateBtn = document.getElementById('generate-all-btn');
    const previewGrid = document.getElementById('preview-grid');

    const errorLevels = [
      { level: 'L', name: 'L级 (7%)', desc: '低容错' },
      { level: 'M', name: 'M级 (15%)', desc: '中容错' },
      { level: 'Q', name: 'Q级 (25%)', desc: '中高容错' },
      { level: 'H', name: 'H级 (30%)', desc: '高容错' },
    ];

    generateBtn.addEventListener('click', async () => {
      try {
        generateBtn.disabled = true;
        generateBtn.textContent = '生成中...';
        previewGrid.innerHTML = '';

        const baseConfig = {
          content: contentInput.value,
          size: parseInt(sizeInput.value, 10),
          margin: parseInt(marginInput.value, 10),
          foregroundColor: foregroundInput.value,
          backgroundColor: backgroundInput.value,
          outputFormat: formatSelect.value,
        };

        // 生成所有容错级别的二维码
        for (const level of errorLevels) {
          const card = document.createElement('div');
          card.className = 'preview-card';

          const title = document.createElement('h4');
          title.textContent = level.name;
          card.appendChild(title);

          const config = {
            ...baseConfig,
            errorCorrectionLevel: level.level,
          };

          const output = await QRCodeGen.generateQRCode(config);

          if (formatSelect.value === 'canvas') {
            card.appendChild(output);
          } else if (formatSelect.value === 'svg') {
            const div = document.createElement('div');
            div.innerHTML = output;
            div.style.width = '100%';
            card.appendChild(div);
          } else if (formatSelect.value === 'base64') {
            const img = document.createElement('img');
            img.src = output;
            img.style.width = '100%';
            card.appendChild(img);
          }

          const desc = document.createElement('p');
          desc.textContent = level.desc;
          desc.style.margin = '10px 0 0 0';
          desc.style.fontSize = '12px';
          desc.style.color = '#999';
          card.appendChild(desc);

          previewGrid.appendChild(card);
        }

      } catch (error) {
        alert(`生成失败: ${error.message}`);
        console.error(error);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = '生成所有容错级别对比';
      }
    });

    // 初始生成
    window.addEventListener('load', () => {
      generateBtn.click();
    });
  </script>
</body>
</html>
